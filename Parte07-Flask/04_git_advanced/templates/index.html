<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/font.css') }}">
</head>
<body class="bg-dark text-light">
  <main class="container vh-100 d-flex align-items-center justify-content-center">
    <div class="card bg-body-tertiary shadow-lg border border-secondary border-opacity-25 rounded-4 p-4 p-md-5" style="max-width: 450px; width: 100%;">
      
      <!-- Primeira section: Logo e Título -->
      <section class="text-center mb-4">
        <figure class="mb-3">
          <img src="{{ url_for('static', filename='img/ghost.png') }}" alt="Logo Git" class="img-fluid" style="max-height: 80px;">
        </figure>
        <h1 class="h3 fw-bold text-light">Git Advanced</h1>
        <p class="text-secondary small">Informe o caminho do seu repositório para continuar</p>
      </section>

      <!-- Segunda section: Formulário -->
      <section>
        <form action="/comitar" method="POST">
          <div class="mb-3">
            <label for="repositorio" class="form-label fw-semibold text-secondary-emphasis small">Caminho do repositório</label>
            <input type="text" id="repositorio" name="repositorio" class="form-control form-control-lg bg-dark text-light border-secondary" placeholder="Ex: C:/projetos/meu-repo" required>
          </div>

          <div class="d-grid gap-2 mt-4">
            <button type="submit" class="btn btn-primary btn-lg fw-semibold shadow-sm">Enviar</button>
          </div>
        </form>
      </section>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
