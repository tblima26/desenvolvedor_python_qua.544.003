<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-white to-blue-50 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden transition-all duration-300">
        <div class="bg-gradient-to-r from-indigo-600 to-blue-600 p-6 text-white text-center">
            <h1 class="text-2xl font-bold tracking-tight">Calculadora de IMC</h1>
            <p class="text-indigo-100 text-sm mt-1">Descubra seu Índice de Massa Corporal</p>
        </div> 
        <div class="p-6 sm:p-8">
            <form action="/imc" method="POST" class="space-y-6">
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Nome Completo</label>
                    <input type="text" id="name" name="name" required
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition text-gray-800 placeholder-gray-400 text-sm"
                        placeholder="Ex: João da Silva" value="{{ name if name else '' }}">
                </div>
                <div>
                    <label for="weight" class="block text-sm font-medium text-gray-700 mb-1">Peso (kg)</label>
                    <input type="number" id="weight" name="weight" step="0.1" min="1" max="500" required
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition text-gray-800 placeholder-gray-400 text-sm"
                        placeholder="Ex: 70.5">
                </div>
                <div>
                    <label for="height" class="block text-sm font-medium text-gray-700 mb-1">Altura (m ou cm)</label>
                    <input type="number" id="height" name="height" step="0.01" min="0.3" max="300" required
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition text-gray-800 placeholder-gray-400 text-sm"
                        placeholder="Ex: 1.75 ou 175">
                    <p class="text-xs text-gray-400 mt-1">Use metros (ex: 1.75) ou centímetros (ex: 175).</p>
                </div>
                <button type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-4 rounded-xl shadow-lg shadow-indigo-200 transition-all duration-200 flex items-center justify-center space-x-2 active:scale-[0.98]">
                    <span>Calcular IMC</span>
                </button>
            </form>

            <!-- Bloco de Resultado -->
            <div class="mt-6 p-5 rounded-xl border transition-all duration-300 {% if imc %}block bg-indigo-50 border-indigo-100{% else %}hidden{% endif %}">
                <h2 class="text-lg font-bold text-indigo-900">Olá, {{ name }}!</h2>
                <p class="text-gray-700 mt-1">Seu IMC é: <strong class="text-indigo-600 text-xl">{{ imc }}</strong></p>
                <p class="text-sm font-medium text-indigo-700 mt-2">{{ mensagem }}</p>
            </div>
        </div>
    </div>
</body>
</html>
