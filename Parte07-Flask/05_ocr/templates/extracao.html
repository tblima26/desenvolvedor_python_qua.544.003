{% extends 'base.html' %}
{% block content %}
<div class="container d-flex align-items-center justify-content-center min-vh-100 py-5">
  <div class="row justify-content-center w-100">
    <div class="col-md-9 col-lg-8">
      
      <!-- Card no modo escuro -->
      <div class="card bg-dark border border-secondary shadow-lg rounded-4 p-4 p-md-5 text-light">
        <div class="card-body p-0">

          <!-- Título com ícone -->
          <h2 class="card-title fw-bold text-light mb-3 text-center">
            <i class="bi bi-file-earmark-text me-2 text-success"></i> Edição de texto extraído
          </h2>
          
          <!-- Descrição sutil -->
          <p class="text-secondary small mb-4 text-center">
            Revise e corrija abaixo o texto capturado pela IA antes de salvar ou finalizar.
          </p>

          <!-- Formulário de Edição -->
          <form action="" method="POST" class="needs-validation" novalidate>
            <div class="mb-4 text-start">
              <label for="texto_extraido" class="form-label fw-semibold text-light">Texto Editável</label>
              
              <!-- Textarea grande, responsiva e com tema escuro -->
              <textarea class="form-control bg-dark text-light border-secondary rounded-3 shadow-sm" 
                        id="texto_extraido" 
                        name="texto_extraido" 
                        rows="10" 
                        required>{{ texto or ''}}</textarea>
              
              <div class="form-text text-muted small mt-1">
                Você pode alterar qualquer palavra ou pontuação incorreta gerada pelo OCR.
              </div>
            </div>

            <!-- Botões de Ação (Salvar / Voltar) -->
            <div class="d-flex flex-column flex-md-row gap-3 justify-content-end">
              <a href="{{ url_for('index') }}" class="btn btn-outline-secondary rounded-pill py-2 px-4 fw-semibold">
                <i class="bi bi-arrow-left me-2"></i> Enviar outra imagem
              </a>
              <button type="submit" class="btn btn-success rounded-pill py-2 px-4 fw-semibold shadow-sm">
                <i class="bi bi-check-lg me-2"></i> Salvar alterações
              </button>
            </div>
          </form>

        </div>
      </div>

    </div>
  </div>
</div>
{% endblock %}
